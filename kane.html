<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お小遣い帳</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>お小遣い帳</h1>

        <!-- サマリー（合計表示） -->
        <div class="summary">
            <div class="summary-box income">
                <h2>総収入</h2>
                <p id="total-income">¥0</p>
            </div>
            <div class="summary-box expense">
                <h2>総支出</h2>
                <p id="total-expense">¥0</p>
            </div>
            <div class="summary-box balance">
                <h2>残高</h2>
                <p id="total-balance">¥0</p>
            </div>
        </div>

        <!-- 入力フォーム -->
        <form id="transaction-form">
            <!-- 1. 上：支出と収入の選択ボタン -->
            <div class="type-selector">
                <input type="radio" id="type-expense" name="type" value="expense" checked>
                <label for="type-expense" class="type-btn expense-label">支出</label>

                <input type="radio" id="type-income" name="type" value="income">
                <label for="type-income" class="type-btn income-label">収入</label>
            </div>

            <!-- 2. 中：金額、用途、場所を入力する欄 -->
            <div class="form-group">
                <label for="amount">金額（円）</label>
                <input type="number" id="amount" placeholder="例: 1000" min="0" required>
            </div>

            <div class="form-group">
                <label for="title">用途</label>
                <input type="text" id="title" placeholder="例: ランチ代、お小遣い" required>
            </div>

            <div class="form-group">
                <label for="location">場所</label>
                <input type="text" id="location" placeholder="例: コンビニ、スーパー" required>
            </div>

            <!-- 3. 下：日付を選べる欄 -->
            <div class="form-group">
                <label for="date">日付</label>
                <input type="date" id="date" required>
            </div>

            <!-- 4. 一番下：決定ボタン -->
            <button type="submit" id="submit-btn">決定</button>
        </form>

        <!-- 履歴一覧 -->
        <div class="history-section">
            <h2>収支履歴</h2>
            <ul id="transaction-list">
                <!-- JavaScriptでここにリストが追加されます -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
