<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お小遣い帳</title>
    <link rel="stylesheet" href="kane_style.css">
    <script type="module" src="kane_script.js" defer></script>
</head>
    <body>
                <a href="top.html" class="back-link">&larr; 戻る</a>
               <!-- 入力フォーム -->
        <form id="transaction-form">
            <!-- 1. 上：支出と収入の選択ボタン -->
            <div class="type-selector">
                <input type="radio" id="type-expense" name="type" value="expense" checked>
                <label for="type-expense" class="type-btn expense-label">支出</label>
                <input type="radio" id="type-income" name="type" value="income">
                <label for="type-income" class="type-btn income-label">収入</label>
            </div>

            <!-- 2. 中：金額、用途、場所を入力する欄 -->
            <div class="form-group">
                <label for="amount">金額（円）</label>
                <input type="number" id="amount" placeholder="例: 1000" min="0" required>
            </div>

            <div id="only-expense">
            <div class="form-group">
                <label for="title">用途</label>
                <input type="text" id="purpose" placeholder="例: ランチ代、お小遣い" required>
            </div>

            <div class="form-group">
                <label for="location">場所</label>
                <input type="text" id="location" placeholder="例: コンビニ、スーパー" required>
            </div>
        </div>

            <!-- 3. 下：日付を選べる欄 -->
            <div class="form-group">
                <label for="date">日付</label>
                <input type="date" id="date" required>
            </div>

            <!-- 4. 一番下：決定ボタン -->
            <button type="submit" id="submit-btn">決定</button>
        </form>

    </body>
</html>
