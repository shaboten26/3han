<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お小遣い帳</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- 収支選択ボタン -->
        <div class="type-selector">
            <button type="button" class="type-btn active expense" id="btnExpense" onclick="changeType('expense')">支出</button>
            <button type="button" class="type-btn income" id="btnIncome" onclick="changeType('income')">収入</button>
        </div>
        <!-- 入力フォーム -->
        <div class="form-group">
            <label for="amount">金額 (円)</label>
            <input type="number" id="amount" placeholder="例: 1000">
        </div>
        <div class="form-group">
            <label for="location">場所 (任意)</label>
            <input type="text" id="location" placeholder="例: スーパー、コンビニ">
        </div>
        <div class="form-group">
            <label for="purpose">用途 (任意)</label>
            <input type="text" id="purpose" placeholder="例: 食費、文房具">
        </div>

        <div class="form-group">
            <label for="date">日付</label>
            <input type="date" id="date">
        </div>

        <!-- 決定ボタン（IDを追加してJavaScriptから色を変えられるようにしました） -->
        <button type="button" class="submit-btn expense" id="submitBtn" onclick="addTransaction()">決定</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
