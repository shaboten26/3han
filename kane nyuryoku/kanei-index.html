<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お小遣い帳</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>お小遣い帳 入力</h2>
        <form id="pocket-money-form">
            <div class="type-selector">
                <button type="button" id="expense-btn" class="type-btn expense active" onclick="switchType('expense')">支出</button>
                <button type="button" id="income-btn" class="type-btn income" onclick="switchType('income')">収入</button>
            </div>

            <div class="form-group">
                <label>金額</label>
                <input type="number" id="amount" placeholder="例: 1000" required min="0">
            </div>

            <div class="form-group">
                <label>場所（任意）</label>
                <input type="text" id="location" placeholder="例: スーパー">
            </div>

            <div class="form-group">
                <label>用途（任意）</label>
                <input type="text" id="purpose" placeholder="例: 食費">
            </div>

            <div class="form-group">
                <label>日付</label>
                <input type="date" id="date" required>
            </div>

            <button type="submit" class="submit-btn">決定</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
